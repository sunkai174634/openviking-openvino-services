services:
  embedding:
    build:
      context: .
      dockerfile: Dockerfile.embedding
    environment:
      MODEL_ID: qwen3-embedding-0.6b-openvino-int8
      MODEL_DIR: /models/OpenVINO/Qwen3-Embedding-0.6B-int8-ov
      OPENVINO_DEVICE: GPU
      MAX_INPUT_TOKENS: 4096
      MAX_QUEUE_SIZE: 4
      QUEUE_TIMEOUT_SECONDS: 2
      REQUEST_TIMEOUT_SECONDS: 30
      LONG_REQUEST_TOKENS: 2048
    ports:
      - "33037:8000"
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "44"
      - "992"

  intent:
    build:
      context: .
      dockerfile: Dockerfile.intent
    environment:
      MODEL_ID: guoxuter/ov_intent_analysis_sft:v7_q8
      MODEL_DIR: /models/OpenVINO/ov_intent_analysis_sft_int8_ov
      OPENVINO_DEVICE: GPU
      MAX_INPUT_TOKENS: 2048
      MAX_NEW_TOKENS: 128
      TEMPERATURE: 0.0
    ports:
      - "33039:8000"
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "44"
      - "992"
