server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # embedding sidecar (same-origin proxy: no CORS, LAN only)
    location /emb/ {
        proxy_pass http://192.168.31.221:33038/;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # intent sidecar
    location /int/ {
        proxy_pass http://192.168.31.221:33039/;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
    }
}
