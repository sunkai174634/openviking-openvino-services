<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sidecar 日志台 · OpenViking</title>
<style>
:root{
  --bg:#0b0e14;--panel:#12161f;--panel2:#161b26;--border:#232a38;
  --text:#d7dde8;--dim:#8b94a7;--accent:#4f8cff;--accent2:#2d5cb8;
  --ok:#3fb970;--warn:#e5b654;--err:#e06c6c;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:600}
header h1 .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:8px;vertical-align:1px}
header h1 .dot.off{background:var(--err)}
.tabs{display:flex;gap:4px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:3px;overflow-x:auto;max-width:100%}
.tabs button{border:0;background:transparent;color:var(--dim);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:13px;white-space:nowrap}
.tabs button.active{background:var(--accent2);color:#fff}
.toolbar{display:flex;gap:8px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center}
select,input{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 10px;font-size:13px;outline:none;max-width:100%}
select:focus,input:focus{border-color:var(--accent)}
input.q{flex:1;min-width:180px;font-family:var(--mono)}
label.auto{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:13px;cursor:pointer;user-select:none}
label.auto input{accent-color:var(--accent)}
main{padding:12px 16px}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px;min-width:760px}
th{position:sticky;top:53px;background:var(--panel);color:var(--dim);text-align:left;font-weight:500;padding:7px 10px;border-bottom:1px solid var(--border);white-space:nowrap;z-index:4}
td{padding:5px 10px;border-bottom:1px solid #1a2130;vertical-align:top;word-break:break-all}
tr:hover td{background:#141927}
.ts{color:var(--dim);white-space:nowrap}
.lv{font-weight:700;white-space:nowrap}
.lv.INFO{color:var(--accent)}.lv.WARNING{color:var(--warn)}.lv.ERROR{color:var(--err)}
.svc{white-space:nowrap}
.svc .b{color:var(--ok)}.svc .i{color:#c678dd}
.evt{color:#61afef;white-space:nowrap}
.rid{color:#e5c07b;cursor:pointer}
.rid:hover{text-decoration:underline}
.detail{color:var(--dim);max-width:520px}
.hl-warn{color:var(--warn);font-weight:700}
.hl-err{color:var(--err);font-weight:700}
tr.row-warn td{background:rgba(229,182,84,.07)}
tr.row-err td{background:rgba(224,108,108,.10)}
tr.row-warn:hover td{background:rgba(229,182,84,.14)}
tr.row-err:hover td{background:rgba(224,108,108,.18)}
/* task table */
.st{white-space:nowrap;font-weight:700}
.st.completed{color:var(--ok)}.st.failed{color:var(--err)}.st.running,.st.processing{color:#61afef}.st.pending{color:var(--warn)}.st.cancelled{color:var(--dim)}
.ttype{white-space:nowrap;color:#c678dd}
.tres{color:#61afef;word-break:break-all}
.terr{color:var(--dim);max-width:520px}
.terr .errline{display:block;color:var(--err)}
.taskbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0}
.taskbar .cnt{color:var(--dim);font-size:13px}
.footer{color:var(--dim);font-size:12px;padding:8px 16px}
.badge{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:2px 10px;font-size:12px;color:var(--dim)}
.empty{color:var(--dim);text-align:center;padding:60px 0}
@media(max-width:640px){
  body{font-size:13px}
  header{padding:10px 10px;gap:8px}
  header h1{font-size:14px;width:100%}
  .tabs{width:100%}
  .tabs button{flex:1;padding:7px 4px;font-size:12px}
  .toolbar{padding:8px 10px}
  main{padding:8px 10px}
  input.q{min-width:100%;flex-basis:100%}
  th{top:0}
  .detail,.terr{max-width:220px}
  .footer{padding:6px 10px}
}
</style>
</head>
<body>
<header>
  <h1><span class="dot" id="dot"></span>Sidecar 日志台</h1>
  <div class="tabs" id="tabs">
    <button data-svc="embedding" class="active">向量服务</button>
    <button data-svc="intent">意图服务</button>
    <button data-svc="tasks">任务中心</button>
  </div>
  <span class="badge" id="verBadge"></span>
  <span class="badge" id="cntBadge">0 条</span>
</header>
<div class="toolbar" id="toolbarLog">
  <select id="fLevel">
    <option value="">全部级别</option>
    <option>INFO</option><option>WARNING</option><option>ERROR</option>
  </select>
  <select id="fEvent"><option value="">全部事件</option></select>
  <input id="fRid" class="q" style="max-width:220px" placeholder="Request ID（点日志里的黄字可填入）">
  <input id="fQ" class="q" placeholder="关键词：路径 / 耗时 / truncated / 任意字段…">
  <label class="auto" title="只显示高耗时/截断/超时警告/告警/错误的行"><input type="checkbox" id="onlyAnom">只看异常</label>
  <label class="auto"><input type="checkbox" id="autoRefresh" checked>自动刷新 5s</label>
  <button id="btnClear" onclick="filtersReset()" style="background:var(--panel2);border:1px solid var(--border);color:var(--dim);border-radius:6px;padding:6px 12px;cursor:pointer">重置</button>
</div>
<div class="taskbar" id="toolbarTasks" hidden>
  <label class="auto"><input type="checkbox" id="onlyFailed" checked>只看失败</label>
  <label class="auto"><input type="checkbox" id="taskRefresh" checked>自动刷新 10s</label>
  <span class="cnt" id="taskCnt"></span>
</div>
<main>
<div class="tablewrap" id="logWrap">
<table>
  <thead><tr>
    <th style="width:180px">时间</th><th style="width:70px">级别</th><th style="width:90px">服务</th>
    <th style="width:150px">事件</th><th style="width:110px">请求ID</th><th>详情</th>
  </tr></thead>
  <tbody id="rows"></tbody>
</table>
</div>
<div class="tablewrap" id="taskWrap" hidden>
<table>
  <thead><tr>
    <th style="width:100px">状态</th><th style="width:160px">类型</th><th style="width:220px">资源</th>
    <th style="width:170px">更新于</th><th>错误 / 结果</th>
  </tr></thead>
  <tbody id="taskRows"></tbody>
</table>
</div>
<div class="empty" id="empty" hidden>暂无匹配日志</div>
<div class="empty" id="taskEmpty" hidden>暂无任务</div>
</main>
<div class="footer" id="foot">—</div>
<script>
const SERVICES={embedding:{url:'/emb',name:'向量服务',cls:'b'},intent:{url:'/int',name:'意图服务',cls:'i'}};
let svc='embedding',events=new Set(),lastData=[];
const $=id=>document.getElementById(id);

/* ---------- logs ---------- */
async function fetchLogs(){
  const p=new URLSearchParams();
  if($('fLevel').value)p.set('level',$('fLevel').value);
  if($('fEvent').value)p.set('event',$('fEvent').value);
  if($('fRid').value.trim())p.set('request_id',$('fRid').value.trim());
  if($('fQ').value.trim())p.set('q',$('fQ').value.trim());
  p.set('limit','300');
  const r=await fetch(SERVICES[svc].url+'/v1/logs?'+p);
  if(!r.ok)throw new Error(r.status);
  return r.json();
}
function fmtDetail(e){return fmtDetailParts(e).map(p=>p.text).join(' ')}
const TH={
  infer_ms:{warn:500,err:2000},
  request_ms:{warn:1000,err:5000},
  generate_ms:{warn:15000,err:30000},
  queue_wait_ms:{warn:200,err:1000},
};
const SPEED_KEYS=new Set(['infer_ms','request_ms','generate_ms']);
function fmtDetailParts(e){
  const skip=new Set(['ts','level','logger','event','request_id']);
  const parts=[];
  for(const[k,v]of Object.entries(e)){
    if(skip.has(k))continue;
    if(k==='exc'){parts.push({text:'exc='+String(v).split('\n').slice(0,2).join(' ⏎ '),cls:'hl-err'});continue}
    let cls='';
    const t=TH[k];
    if(t&&typeof v==='number'){
      if(v>=t.err)cls='hl-err';else if(v>=t.warn)cls='hl-warn';
    }
    if((k.endsWith('_truncated')||k==='input_truncated')&&v===true)cls='hl-warn';
    if(k==='queue_timeouts'&&v>0)cls='hl-warn';
    parts.push({text:k+'='+(typeof v==='object'?JSON.stringify(v):v),cls});
  }
  return parts;
}
function anomaly(e){
  if(e.level==='ERROR')return 'err';
  if(e.level==='WARNING')return 'warn';
  if(e.input_truncated===true||e.prompt_truncated===true||e.output_truncated===true)return 'warn';
  if(e.queue_timeouts>0)return 'warn';
  const slow=e.lane==='slow'||e.is_long_request===true;
  for(const[k,t]of Object.entries(TH)){
    if(slow&&SPEED_KEYS.has(k)&&k!=='queue_wait_ms')continue;
    const v=e[k];
    if(typeof v==='number'&&v>=t.err)return 'err';
    if(typeof v==='number'&&v>=t.warn)return 'warn';
  }
  return '';
}
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function render(d){
  lastData=d;
  $('verBadge').textContent=(d.service||svc)+' v'+(d.version||'?');
  $('cntBadge').textContent=d.buffer_total+' 条缓存 / 显示 '+d.entries.length;
  $('dot').classList.remove('off');
  for(const e of d.entries)if(e.event)events.add(e.event);
  const sel=$('fEvent'),cur=sel.value;
  sel.innerHTML='<option value="">全部事件</option>'+[...events].sort().map(x=>`<option${x===cur?' selected':''}>${esc(x)}</option>`).join('');
  const tb=$('rows');
  let entries=d.entries;
  if($('onlyAnom').checked)entries=entries.filter(e=>anomaly(e));
  tb.innerHTML=entries.map(e=>{
    const a=anomaly(e);
    return `<tr${a?` class="row-${a}"`:''}>
    <td class="ts">${esc((e.ts||'').replace('T',' ').slice(0,23))}</td>
    <td class="lv ${esc(e.level)}">${esc(e.level)}</td>
    <td class="svc"><span class="${SERVICES[svc].cls}">●</span> ${SERVICES[svc].name}</td>
    <td class="evt">${esc(e.event)}</td>
    <td class="rid" title="点击筛选此请求" onclick="byRid('${esc(e.request_id)}')">${esc(e.request_id||'')}</td>
    <td class="detail">${fmtDetailParts(e).map(p=>p.cls?`<span class="${p.cls}">${esc(p.text)}</span>`:esc(p.text)).join(' ')}</td>
  </tr>`}).join('');
  $('empty').hidden=entries.length>0;
  $('foot').textContent='更新于 '+new Date().toLocaleTimeString('zh-CN')+' · 端点 '+SERVICES[svc].url+'/v1/logs'+($('onlyAnom').checked?' · 只看异常 '+entries.length+' 条':'');
}
async function refresh(){
  try{render(await fetchLogs())}catch(err){
    $('dot').classList.add('off');
    $('foot').textContent='连接失败：'+SERVICES[svc].url+'（'+err.message+'）';
  }
}
function byRid(rid){$('fRid').value=rid;refresh()}
function filtersReset(){['fLevel','fEvent','fRid','fQ'].forEach(i=>$(i).value='');refresh()}

/* ---------- tasks ---------- */
function taskStatusClass(s){
  s=String(s||'').toLowerCase();
  if(s==='completed'||s==='success')return 'completed';
  if(s==='failed'||s==='error')return 'failed';
  if(s==='running'||s==='processing')return 'running';
  if(s==='pending'||s==='queued')return 'pending';
  if(s==='cancelled'||s==='canceled')return 'cancelled';
  return 'pending';
}
function taskErrorHtml(err){
  if(!err)return '';
  const s=String(err);
  const m=s.match(/message['":\s]+([^'",}]{5,200})/);
  const head=m?m[1]:s.slice(0,180);
  return `<span class="errline">${esc(head)}</span>`;
}
async function fetchTasks(){
  const p=new URLSearchParams();
  p.set('limit','100');
  const r=await fetch('/ovt/api/v1/tasks?'+p);
  if(!r.ok)throw new Error(r.status);
  return r.json();
}
function fmtTime(iso){
  if(!iso)return '';
  return String(iso).replace('T',' ').replace('Z','').slice(0,19);
}
function renderTasks(d){
  const list=(d&&(d.result||d.data||d.tasks||[]))||[];
  const onlyF=$('onlyFailed').checked;
  let rows=list;
  if(onlyF)rows=rows.filter(t=>String(t.status||'').toLowerCase()==='failed');
  rows=rows.slice().sort((a,b)=>String(b.updated_at_iso||b.updated_at||'').localeCompare(String(a.updated_at_iso||a.updated_at||'')));
  $('taskCnt').textContent='共 '+list.length+' 条'+(onlyF?' · 失败 '+rows.length+' 条':'');
  $('taskRows').innerHTML=rows.map(t=>{
    const st=t.status||'';
    const cls=taskStatusClass(st);
    const err=t.error||t.err||t.message||'';
    return `<tr class="${cls==='failed'?'row-err':cls==='running'?'row-warn':''}">
    <td class="st ${cls}">${esc(st)}</td>
    <td class="ttype">${esc(t.task_type||t.type||'')}</td>
    <td class="tres">${esc(t.resource_id||t.session_id||'')}</td>
    <td class="ts">${esc(fmtTime(t.updated_at_iso||t.updated_at))}</td>
    <td class="terr">${taskErrorHtml(err)}${t.result?esc(JSON.stringify(t.result).slice(0,160)):''}</td>
  </tr>`}).join('');
  $('taskEmpty').hidden=rows.length>0;
}
async function refreshTasks(){
  try{renderTasks(await fetchTasks())}catch(err){
    $('dot').classList.add('off');
    $('foot').textContent='任务中心连接失败（'+err.message+'）';
  }
}

/* ---------- tabs ---------- */
function setTab(name){
  svc=name;events=new Set();
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x.dataset.svc===name));
  const isTasks=name==='tasks';
  $('toolbarLog').hidden=isTasks;
  $('toolbarTasks').hidden=!isTasks;
  $('logWrap').hidden=isTasks;
  $('taskWrap').hidden=!isTasks;
  $('empty').hidden=true;
  $('taskEmpty').hidden=!isTasks;
  $('verBadge').textContent=isTasks?'OpenViking 任务':(SERVICES[name].name+' v?');
  if(isTasks){refreshTasks()}else{refresh()}
}
document.getElementById('tabs').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  setTab(b.dataset.svc);
});
['fLevel','fEvent'].forEach(i=>$(i).addEventListener('change',refresh));
$('onlyAnom').addEventListener('change',refresh);
$('onlyFailed').addEventListener('change',refreshTasks);
$('taskRefresh').addEventListener('change',()=>{});
['fRid','fQ'].forEach(i=>$(i).addEventListener('input',()=>{clearTimeout(i._t);i._t=setTimeout(refresh,400)}));
setInterval(()=>{if($('autoRefresh').checked&&svc!=='tasks')refresh()},5000);
setInterval(()=>{if($('taskRefresh').checked&&svc==='tasks')refreshTasks()},10000);
refresh();
</script>
</body>
</html>
