<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidecar 日志台</title>
<style>
:root{
  --bg:#0b0e14;--panel:#12161f;--panel2:#161b26;--border:#232a38;
  --text:#d7dde8;--dim:#8b94a7;--accent:#4f8cff;--accent2:#2d5cb8;
  --ok:#3fb970;--warn:#e5b654;--err:#e06c6c;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:600}
header h1 .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:8px;vertical-align:1px}
header h1 .dot.off{background:var(--err)}
.tabs{display:flex;gap:4px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:3px}
.tabs button{border:0;background:transparent;color:var(--dim);padding:5px 14px;border-radius:6px;cursor:pointer;font-size:13px}
.tabs button.active{background:var(--accent2);color:#fff}
.toolbar{display:flex;gap:8px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center}
select,input{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 10px;font-size:13px;outline:none}
select:focus,input:focus{border-color:var(--accent)}
input.q{flex:1;min-width:200px;font-family:var(--mono)}
label.auto{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:13px;cursor:pointer;user-select:none}
label.auto input{accent-color:var(--accent)}
main{padding:12px 20px}
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px}
th{position:sticky;top:53px;background:var(--panel);color:var(--dim);text-align:left;font-weight:500;padding:7px 10px;border-bottom:1px solid var(--border);white-space:nowrap;z-index:4}
td{padding:5px 10px;border-bottom:1px solid #1a2130;vertical-align:top;word-break:break-all}
tr:hover td{background:#141927}
.ts{color:var(--dim);white-space:nowrap}
.lv{font-weight:700;white-space:nowrap}
.lv.INFO{color:var(--accent)}.lv.WARNING{color:var(--warn)}.lv.ERROR{color:var(--err)}
.svc{white-space:nowrap}
.svc .b{color:var(--ok)}.svc .i{color:#c678dd}
.evt{color:#61afef;white-space:nowrap}
.rid{color:#e5c07b;cursor:pointer}
.rid:hover{text-decoration:underline}
.detail{color:var(--dim);max-width:520px}
.footer{color:var(--dim);font-size:12px;padding:8px 20px}
.badge{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:2px 10px;font-size:12px;color:var(--dim)}
.empty{color:var(--dim);text-align:center;padding:60px 0}
</style>
</head>
<body>
<header>
  <h1><span class="dot" id="dot"></span>Sidecar 日志台</h1>
  <div class="tabs" id="tabs">
    <button data-svc="embedding" class="active">向量服务</button>
    <button data-svc="intent">意图服务</button>
  </div>
  <span class="badge" id="verBadge"></span>
  <span class="badge" id="cntBadge">0 条</span>
</header>
<div class="toolbar">
  <select id="fLevel">
    <option value="">全部级别</option>
    <option>INFO</option><option>WARNING</option><option>ERROR</option>
  </select>
  <select id="fEvent"><option value="">全部事件</option></select>
  <input id="fRid" class="q" style="max-width:220px" placeholder="Request ID（点日志里的黄字可填入）">
  <input id="fQ" class="q" placeholder="关键词：路径 / 耗时 / truncated / 任意字段…">
  <label class="auto"><input type="checkbox" id="autoRefresh" checked>自动刷新 5s</label>
  <button id="btnClear" onclick="filtersReset()" style="background:var(--panel2);border:1px solid var(--border);color:var(--dim);border-radius:6px;padding:6px 12px;cursor:pointer">重置</button>
</div>
<main>
<table>
  <thead><tr>
    <th style="width:180px">时间</th><th style="width:70px">级别</th><th style="width:90px">服务</th>
    <th style="width:150px">事件</th><th style="width:110px">请求ID</th><th>详情</th>
  </tr></thead>
  <tbody id="rows"></tbody>
</table>
<div class="empty" id="empty" hidden>暂无匹配日志</div>
</main>
<div class="footer" id="foot">—</div>
<script>
const SERVICES={embedding:{url:'/emb',name:'向量服务',cls:'b'},intent:{url:'/int',name:'意图服务',cls:'i'}};
let svc='embedding',events=new Set(),lastData=[];
const $=id=>document.getElementById(id);

async function fetchLogs(){
  const p=new URLSearchParams();
  if($('fLevel').value)p.set('level',$('fLevel').value);
  if($('fEvent').value)p.set('event',$('fEvent').value);
  if($('fRid').value.trim())p.set('request_id',$('fRid').value.trim());
  if($('fQ').value.trim())p.set('q',$('fQ').value.trim());
  p.set('limit','300');
  const r=await fetch(SERVICES[svc].url+'/v1/logs?'+p);
  if(!r.ok)throw new Error(r.status);
  return r.json();
}
function fmtDetail(e){
  const skip=new Set(['ts','level','logger','event','request_id']);
  const parts=[];
  for(const[k,v]of Object.entries(e)){
    if(skip.has(k))continue;
    if(k==='exc'){parts.push('exc='+String(v).split('\n').slice(0,2).join(' ⏎ '));continue}
    parts.push(k+'='+(typeof v==='object'?JSON.stringify(v):v));
  }
  return parts.join(' ');
}
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function render(d){
  lastData=d;
  $('verBadge').textContent=(d.service||svc)+' v'+(d.version||'?');
  $('cntBadge').textContent=d.total+' 条缓存 / 显示 '+d.entries.length;
  $('dot').classList.remove('off');
  for(const e of d.entries)if(e.event)events.add(e.event);
  const sel=$('fEvent'),cur=sel.value;
  sel.innerHTML='<option value="">全部事件</option>'+[...events].sort().map(x=>`<option${x===cur?' selected':''}>${esc(x)}</option>`).join('');
  const tb=$('rows');
  tb.innerHTML=d.entries.map(e=>`<tr>
    <td class="ts">${esc((e.ts||'').replace('T',' ').slice(0,23))}</td>
    <td class="lv ${esc(e.level)}">${esc(e.level)}</td>
    <td class="svc"><span class="${SERVICES[svc].cls}">●</span> ${SERVICES[svc].name}</td>
    <td class="evt">${esc(e.event)}</td>
    <td class="rid" title="点击筛选此请求" onclick="byRid('${esc(e.request_id)}')">${esc(e.request_id||'')}</td>
    <td class="detail">${esc(fmtDetail(e))}</td>
  </tr>`).join('');
  $('empty').hidden=d.entries.length>0;
  $('foot').textContent='更新于 '+new Date().toLocaleTimeString('zh-CN')+' · 端点 '+SERVICES[svc].url+'/v1/logs';
}
async function refresh(){
  try{render(await fetchLogs())}catch(err){
    $('dot').classList.add('off');
    $('foot').textContent='连接失败：'+SERVICES[svc].url+'（'+err.message+'）';
  }
}
function byRid(rid){$('fRid').value=rid;refresh()}
function filtersReset(){['fLevel','fEvent','fRid','fQ'].forEach(i=>$(i).value='');refresh()}
document.getElementById('tabs').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  svc=b.dataset.svc;events=new Set();
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x===b));
  $('fEvent').innerHTML='<option value="">全部事件</option>';
  refresh();
});
['fLevel','fEvent'].forEach(i=>$(i).addEventListener('change',refresh));
['fRid','fQ'].forEach(i=>$(i).addEventListener('input',()=>{clearTimeout(i._t);i._t=setTimeout(refresh,400)}));
setInterval(()=>{if($('autoRefresh').checked)refresh()},5000);
refresh();
</script>
</body>
</html>
